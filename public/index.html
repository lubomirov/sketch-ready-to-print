<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выпрямление рисунков OpenCV.js</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f0f0f0;
            display: flex;
        }

        .tabs-rail {
            flex: 0 0 48px;
            width: 48px;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            background: #ddd;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
        }

        .tab-btn {
            width: 48px;
            height: 48px;
            padding: 0;
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 0;
            background: #ddd;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }

        .tab-btn:hover {
            background: #ccc;
        }

        .tab-btn.active,
        .tab-btn.active:hover {
            background: #ffffff;
            color: #D55717;
        }

        .tab-btn svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            fill: none;
        }

        .sidebar {
            flex: 0 0 300px;
            width: 300px;
            height: 100vh;
            overflow-y: auto;
            background: #ffffff;
            border-right: 1px solid #ddd;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .tab-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .step {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        .step:last-of-type { border-bottom: none; padding-bottom: 0; }

        .step-control { text-align: center; color: #666; }
        .step-control.inactive { display: none; }

        button:disabled { opacity: 0.5; pointer-events: none; }
        button, .btn-file {
            width: 100%;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: #f0f0f0;
            text-align: center;
        }
        .btn-file input[type="file"] { display: none; }
        .btn-file:has(input:disabled) { opacity: 0.5; cursor: default; pointer-events: none; }

        #opencvStatus { color: #AAA; }
        #opencvStatus.ready { color: #388e3c; }

        .mask-edit-title { font-weight: 600; margin-bottom: 6px; }
        .mask-edit-row { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
        .mask-edit-row button { width: auto; }
        .mask-edit-row button.active { background: #d7f4dd; border-color: #50a665; }
        .mask-edit-row input[type="number"] { width: 55px; }

        .lightmap-preview {
            width: 100%;
            height: 180px;
            max-height: 180px;
            border: 1px solid #d7d7d7;
            background: #f8f8f8;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightmap-preview canvas {
            border: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: #fff;
            display: block;
        }

        .canvas-area {
            flex: 1 1 auto;
            height: 100vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        canvas { border: 1px solid #ccc; max-width: 100%; background: #fff; height: auto; }

        @media (max-width: 980px) {
            body {
                flex-direction: column;
            }

            .tabs-rail {
                width: 100%;
                flex-basis: auto;
                height: auto;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .sidebar {
                width: 100%;
                flex-basis: auto;
                height: auto;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .canvas-area {
                height: auto;
                min-height: 50vh;
                padding: 14px;
            }
        }
    </style>
    <script async src="opencv.js" type="text/javascript"></script>
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="tabs-rail" role="tablist" aria-label="Этапы обработки">
        <button class="tab-btn active" type="button" data-tab="tab-1" role="tab" aria-selected="true" title="Фото">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2H19L26 9V28A2 2 0 0 1 24 30H6A2 2 0 0 1 4 28V4A2 2 0 0 1 6 2Z"/>
                <path d="M19 2V9H26"/>
                <path d="M15 25V15ZM11 19L15 15L19 19"/>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-2" role="tab" aria-selected="false" title="Углы">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 21V11M9 7.66L21 6.33M24.6 9L27.4 23M25 25.72L9 24.27"/>
                <circle cx="6" cy="8" r="3"/>
                <circle cx="24" cy="6" r="3"/>
                <circle cx="28" cy="26" r="3"/>
                <circle cx="6" cy="24" r="3"/>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-3" role="tab" aria-selected="false" title="Грани">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 7C11 9 21 9 27 7V25C21 23 11 23 5 25V7Z"/>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-4" role="tab" aria-selected="false" title="Освещение">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="16" cy="16" r="5"/>
                <path d="M16 5V7.5ZM16 24.5V27ZM7.5 7.52L9 9ZM23 23L24.5 24.5ZM5 16H7.5ZM24.5 16H27ZM7.5 24.5L9 23ZM23 9L24.5 7.5Z"/>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-5" role="tab" aria-selected="false" title="Экспорт">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 7V19M11 14l5 5 5-5M9 24h14"/>
                <path d="M7 24h18"/>
            </svg>
        </button>
    </div>

    <div class="sidebar">
        <h2>Автокоррекция [ <span id="opencvStatus">Loading...</span> ]</h2>

        <div class="tab-content">
            <div class="tab-pane active" id="tab-1" role="tabpanel">
                <div class="step">
                    <label class="btn-file">Открыть фото
                        <input type="file" id="fileInput" accept="image/*" disabled>
                    </label>
                    <div id="input_filename" class="step-control">no file</div>
                </div>
            </div>

            <div class="tab-pane" id="tab-2" role="tabpanel">
                <div class="step">
                    <button id="findCornersBtn" disabled>Найти углы</button>
                    <div id="cornersStatus" class="step-control inactive"></div>
                    <button id="fixGeometryBtn" disabled>Исправить перспективу</button>
                    <div id="geometryControls" class="step-control inactive">
                        <label for="marginInput">Поля (px):</label>
                        <input type="range" id="marginInput" min="0" max="200" value="75" step="5">
                        <input type="number" id="marginValue" min="0" max="200" value="75" style="width: 45px;">
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="tab-3" role="tabpanel">
                <div class="step">
                    <button id="findCurvedEdgesBtn" disabled>Найти искривления</button>
                    <div id="curvedInfo" class="step-control inactive"></div>
                    <button id="fixCurvedEdgesBtn" disabled>Исправить кривые грани</button>
                </div>
            </div>

            <div class="tab-pane" id="tab-4" role="tabpanel">
                <div class="step">
                    <button id="detectSheetMaskBtn" disabled>Определить фон</button>
                    <div id="editMask" class="step-control inactive">
                        Все зеленое надо стереть, чтобы выявить перепады освещения
                        <div class="mask-edit-row">
                            <button id="maskAddBtn" type="button">Add Green</button>
                            <button id="maskEraseBtn" type="button">Erase</button>
                        </div>
                        <div class="mask-edit-row">
                            <label for="maskBrushSize">Size:</label>
                            <input type="range" id="maskBrushSize" min="10" max="50" value="20" step="1">
                            <input type="number" id="maskBrushSizeValue" min="10" max="50" value="20">
                        </div>
                    </div>
                    <button id="recalcLightMapBtn" disabled>Пересчитать карту освещенности</button>
                    <div id="lightMapZone" class="step-control inactive">
                        <div style="font-weight: 600; margin-bottom: 6px;">Normalized Light Map</div>
                        <div class="lightmap-preview">
                            <canvas id="lightMapCanvas" width="1" height="1"></canvas>
                        </div>
                    </div>
                    <button id="normalizeBrightnessBtn" disabled>Нормализовать яркость</button>
                </div>
            </div>

            <div class="tab-pane" id="tab-5" role="tabpanel">
                <div class="step">
                    <button id="saveBtn" disabled>Сохранить результат</button>
                </div>
            </div>

            <div id="processStatus" class="step-control" style="color: #0288d1;"></div>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="canvas"></canvas>
    </div>

</body>
</html>
