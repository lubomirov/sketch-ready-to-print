<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выпрямление рисунков OpenCV.js</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
        .toolbar { display: flex; gap: 20px; margin-bottom: 40px; }
        .step { display: flex; flex-direction: column; gap: 10px; flex-basis: 270px; }
        .step-control { text-align: center; color: #666; }
        .step-control.inactive { display: none; }
        button:disabled { opacity: 0.5; pointer-events: none; }
        canvas { border: 1px solid #ccc; max-width: 1000px; background: #fff; height: auto; }
        button, .btn-file { padding: 10px 15px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: #f0f0f0; text-align: center;}
        .btn-file input[type="file"] { display: none; }
        .btn-file:has(input:disabled) { opacity: 0.5; cursor: default; pointer-events: none; }
        #opencvStatus { color: #AAA; }
        #opencvStatus.ready { color: #388e3c; }
    </style>
    <script async src="opencv.js" type="text/javascript"></script>
    <script type="module" src="app.js"></script>
</head>
<body>

    <h2>Автокоррекция фотографии наброска [ <span id="opencvStatus">Loading...</span> ]</h2>
    
    <div class="toolbar">
        <div class="step">
            <label class="btn-file">Открыть фото
                <input type="file" id="fileInput" accept="image/*" disabled>
            </label>
            <div id="input_filename" class="step-control">no file</div>
        </div>
        <div class="step">
            <button id="findCornersBtn" disabled>Найти углы</button>
            <div id="cornersStatus" class="step-control inactive"></div>
            <button id="fixGeometryBtn" disabled>Исправить перспективу</button>
            <div id="geometryControls" class="step-control inactive">
                <label for="marginInput">Поля (px):</label>
                <input type="range" id="marginInput" min="0" max="200" value="75" step="5">
                <input type="number" id="marginValue" min="0" max="200" value="75" style="width: 45px;">
            </div>
        </div>
        <div class="step">
            <button id="findCurvedEdgesBtn" disabled>Найти искривления</button>
            <div id="curvedInfo" class="step-control inactive"></div>
            <button id="fixCurvedEdgesBtn" disabled>Исправить кривые грани</button>
        </div>
        <div class="step">
            <button id="analyzeBrightnessBtn" disabled>Анализировать яркость</button>
            <button id="normalizeBrightnessBtn" disabled>Нормализовать яркость</button>
        </div>
        <div class="step">
            <button id="saveBtn" disabled>Сохранить результат</button>
            <div id="processStatus" class="step-control" style="color: #0288d1;"></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

</body>
</html>
