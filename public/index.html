<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sketch Ready to Print</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script async src="vendor/opencv.js" type="text/javascript"></script>
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="tabs-rail" role="tablist">
        <button class="tab-btn active" type="button" data-tab="tab-1" role="tab" aria-selected="true" title="Load Photo">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#load-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-2" role="tab" aria-selected="false" title="Rotate">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#rotate-left-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-3" role="tab" aria-selected="false" title="Perspective">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#perspective-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-4" role="tab" aria-selected="false" title="Edges">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#edges-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-5" role="tab" aria-selected="false" title="Brightness">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#brightness-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-6" role="tab" aria-selected="false" title="Light map">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#light-map-icon"></use>
            </svg>
        </button>
        <button class="tab-btn" type="button" data-tab="tab-7" role="tab" aria-selected="false" title="Export">
            <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <use href="icons.svg#export-icon"></use>
            </svg>
        </button>
        <div id="opencvStatus" class="opencv-status" title="OpenCV is loading...">
            <svg viewBox="0 0 64 64" class="opencv-logo" aria-hidden="true">
                <use href="icons.svg#opencv-icon"></use>
            </svg>
        </div>
    </div>

    <div class="sidebar">
        <h2>Correction of Sketch Photo</h2>

        <div class="tab-pane active" id="tab-1" role="tabpanel">
            <label class="btn-file">Open Photo
                <input type="file" id="fileInput" accept="image/*" disabled>
            </label>
            <div id="input_filename" class="step-control">no file</div>
        </div>

        <div class="tab-pane" id="tab-2" role="tabpanel">
            <button id="rotateLeftBtn" disabled>
                <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <use href="icons.svg#rotate-left-icon"></use>
                </svg>
                Rotate Left
            </button>
            <button id="rotateRightBtn" disabled>
                <svg viewBox="0 0 32 32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <use href="icons.svg#rotate-right-icon"></use>
                </svg>
                Rotate Right
            </button>
        </div>

        <div class="tab-pane" id="tab-3" role="tabpanel">
            <div id="cornersStatus" class="step-control inactive"></div>
            <button id="fixGeometryBtn" disabled>Fix Perspective</button>
            <div id="geometryControls" class="step-control inactive">
                <label for="marginInput">Margins (px):</label>
                <input type="range" id="marginInput" min="0" max="200" value="75" step="5">
                <input type="number" id="marginValue" min="0" max="200" value="75" style="width: 45px;">
            </div>
        </div>

        <div class="tab-pane" id="tab-4" role="tabpanel">
            <div id="curvedInfo" class="step-control inactive"></div>
            <button id="fixCurvedEdgesBtn" disabled>Fix Curved Edges</button>
        </div>

        <div class="tab-pane" id="tab-5" role="tabpanel">
            <div class="brightness-histogram">
                <canvas id="histogramCanvas" width="260" height="160"></canvas>
                <div id="histogramStats" class="histogram-stats"></div>
            </div>
            <div class="brightness-field">
                <label for="blackPointInput">Новый черный</label>
                <input id="blackPointInput" type="number" min="0" max="255" value="0">
                <small id="blackPointHint"></small>
            </div>
            <div class="brightness-field">
                <label for="whitePointInput">Новый белый</label>
                <input id="whitePointInput" type="number" min="0" max="255" value="255">
                <small id="whitePointHint"></small>
            </div>
            <button id="stretchBrightnessBtn" disabled>Скорректировать яркость</button>
        </div>

        <div class="tab-pane" id="tab-6" role="tabpanel">
            <button id="detectSheetMaskBtn" disabled>Detect Background</button>
            <div id="editMask" class="step-control inactive">
                Erase all green to reveal lighting variations
                <div class="mask-edit-row">
                    <button id="maskAddBtn" type="button">Add Green</button>
                    <button id="maskEraseBtn" type="button">Erase</button>
                </div>
                <div class="mask-edit-row">
                    <label for="maskBrushSize">Size:</label>
                    <input type="range" id="maskBrushSize" min="10" max="50" value="20" step="1">
                    <input type="number" id="maskBrushSizeValue" min="10" max="50" value="20">
                </div>
            </div>
            <div class="mask-edit-row step-control">
                <label>Режим:</label>
                <button id="paperModeWhiteBtn" type="button" class="active">Белая бумага</button>
                <button id="paperModeColorBtn" type="button">Цветная бумага</button>
            </div>
            <div id="coloredPaperControls" class="step-control inactive">
                <div class="mask-edit-row">
                    <button id="addReferencePointBtn" type="button">Эталон бумаги</button>
                    <button id="addBlackReferencePointBtn" type="button">Эталон чёрного</button>
                    <button id="addWhiteReferencePointBtn" type="button">Эталон белого</button>
                </div>
                <div class="mask-edit-row">
                    <label for="referenceRadius">Радиус:</label>
                    <input type="range" id="referenceRadius" min="10" max="200" value="50" step="1">
                    <input type="number" id="referenceRadiusValue" min="10" max="200" value="50">
                </div>
                <div id="referenceStats" class="step-control reference-stats">
                    <div class="reference-stats-summary">Точек: 0; диапазон: -; среднее: -</div>
                </div>
                <div class="mask-edit-row">
                    <label for="blackColorPicker">Цвет чёрного:</label>
                    <input id="blackColorPicker" class="paper-color-picker" type="color" value="#000000" aria-label="Цвет чёрного">
                </div>
                <div class="mask-edit-row">
                    <label for="paperColorPicker">Цвет бумаги:</label>
                    <input id="paperColorPicker" class="paper-color-picker" type="color" value="#ffffff" aria-label="Цвет бумаги">
                </div>
                <div class="mask-edit-row">
                    <label for="whiteColorPicker">Цвет светлого эталона:</label>
                    <input id="whiteColorPicker" class="paper-color-picker" type="color" value="#ffffff" aria-label="Цвет светлого эталона">
                </div>
            </div>
            <button id="recalcLightMapBtn" disabled>Пересчитать карту освещенности</button>
            <div id="lightMapZone" class="step-control inactive">
                <div style="font-weight: 600; margin-bottom: 6px;">Normalized Light Map</div>
                <div class="lightmap-preview">
                    <canvas id="lightMapCanvas" width="1" height="1"></canvas>
                </div>
            </div>
            <button id="applyLightMapBtn" disabled>Скорректировать яркость</button>
        </div>

        <div class="tab-pane" id="tab-7" role="tabpanel">
            <button id="saveBtn" disabled>Сохранить результат</button>
        </div>

        <div id="processStatus" class="step-control" style="color: #D55717;"></div>
    </div>

    <div class="canvas-area">
        <div id="canvasViewport" class="canvas-viewport">
            <canvas id="canvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
            <canvas id="cursorCanvas"></canvas>
        </div>
        <div class="viewport-controls" aria-label="Масштаб изображения">
            <span>Pan: "SPACE" + mouse drag</span>
            <button id="fitZoomBtn" type="button" class="active">Fit to screen</button>
            <button id="actualZoomBtn" type="button">1:1</button>
        </div>
    </div>

</body>
</html>
