<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выпрямление рисунков OpenCV.js</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
        .container { display: flex; gap: 20px; margin-bottom: 40px; }
        .panel { display: flex; flex-direction: column; gap: 10px; }
        .panel h3 { margin: 0; }
        canvas { border: 1px solid #ccc; max-width: 600px; background: #fff; height: auto; }
        button, .btn-file { padding: 10px 15px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: #f0f0f0; }
        .btn-file input[type="file"] { display: none; }
        .btn-file:has(input:disabled) { opacity: 0.5; cursor: default; pointer-events: none; }
        #fixGeometryBtn:disabled ~ div { visibility: hidden; }
        #opencv_status { color: #AAA; }
        #opencv_status.ready { color: #388e3c; }
    </style>
    <script async src="opencv.js" type="text/javascript"></script>
    <script type="module" src="app.js"></script>
</head>
<body>

    <h2>Автокоррекция фотографии наброска [ <span id="opencv_status">Loading...</span> ]</h2>
    
    <div class="container">
        <div class="panel">
            <label class="btn-file">Открыть фото
                <input type="file" id="fileInput" accept="image/*" disabled>
            </label>
        </div>
        <div class="panel">
            <button id="fixGeometryBtn" disabled>Выпрямить перспективу</button>
            <div>
                <div>Перетащите зеленые кружочки</div>
                <label for="marginInput">Поля (px):</label>
                <input type="range" id="marginInput" min="0" max="200" value="75" step="5">
                <input type="number" id="marginValue" min="0" max="200" value="75" style="width: 45px;">
            </div>
        </div>
        <div class="panel">
            <button id="normalizeBtn" disabled>Нормализовать яркость</button>
        </div>
        <div class="panel">
            <button id="saveBtn" disabled>Сохранить результат</button>
            <span id="processStatus" style="margin-left: 15px; color: #0288d1;"></span>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <h3>Исходное фото</h3>
            <canvas id="canvasInput"></canvas>
        </div>
        <div class="panel">
            <h3>Результат</h3>
            <canvas id="canvasOutput"></canvas>
        </div>
    </div>

</body>
</html>
