<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выпрямление рисунков OpenCV.js</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f0f0f0;
            display: flex;
        }

        .sidebar {
            flex: 0 0 320px;
            width: 320px;
            height: 100vh;
            overflow-y: auto;
            background: #fafafa;
            border-right: 1px solid #ddd;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .step {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        .step:last-of-type { border-bottom: none; padding-bottom: 0; }

        .step-control { text-align: center; color: #666; }
        .step-control.inactive { display: none; }

        button:disabled { opacity: 0.5; pointer-events: none; }
        button, .btn-file {
            width: 100%;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: #f0f0f0;
            text-align: center;
        }
        .btn-file input[type="file"] { display: none; }
        .btn-file:has(input:disabled) { opacity: 0.5; cursor: default; pointer-events: none; }

        #opencvStatus { color: #AAA; }
        #opencvStatus.ready { color: #388e3c; }

        .mask-edit-title { font-weight: 600; margin-bottom: 6px; }
        .mask-edit-row { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
        .mask-edit-row button { width: auto; }
        .mask-edit-row button.active { background: #d7f4dd; border-color: #50a665; }
        .mask-edit-row input[type="number"] { width: 55px; }

        .canvas-area {
            flex: 1 1 auto;
            height: 100vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        canvas { border: 1px solid #ccc; max-width: 100%; background: #fff; height: auto; }
    </style>
    <script async src="opencv.js" type="text/javascript"></script>
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>Автокоррекция фотографии наброска [ <span id="opencvStatus">Loading...</span> ]</h2>

        <div class="step">
            <label class="btn-file">Открыть фото
                <input type="file" id="fileInput" accept="image/*" disabled>
            </label>
            <div id="input_filename" class="step-control">no file</div>
        </div>
        <div class="step">
            <button id="findCornersBtn" disabled>Найти углы</button>
            <div id="cornersStatus" class="step-control inactive"></div>
            <button id="fixGeometryBtn" disabled>Исправить перспективу</button>
            <div id="geometryControls" class="step-control inactive">
                <label for="marginInput">Поля (px):</label>
                <input type="range" id="marginInput" min="0" max="200" value="75" step="5">
                <input type="number" id="marginValue" min="0" max="200" value="75" style="width: 45px;">
            </div>
        </div>
        <div class="step">
            <button id="findCurvedEdgesBtn" disabled>Найти искривления</button>
            <div id="curvedInfo" class="step-control inactive"></div>
            <button id="fixCurvedEdgesBtn" disabled>Исправить кривые грани</button>
        </div>
        <div class="step">
            <button id="detectSheetMaskBtn" disabled>Определить фон</button>
            <div id="editMask" class="step-control inactive">
                Все зеленое надо стереть, чтобы выявить перепады освещения
                <div class="mask-edit-row">
                    <button id="maskAddBtn" type="button">Add Green</button>
                    <button id="maskEraseBtn" type="button">Erase</button>
                </div>
                <div class="mask-edit-row">
                    <label for="maskBrushSize">Size:</label>
                    <input type="range" id="maskBrushSize" min="10" max="50" value="20" step="1">
                    <input type="number" id="maskBrushSizeValue" min="10" max="50" value="20">
                </div>
            </div>
            <button id="normalizeBrightnessBtn" disabled>Нормализовать яркость</button>
        </div>
        <div class="step">
            <button id="saveBtn" disabled>Сохранить результат</button>
            <div id="processStatus" class="step-control" style="color: #0288d1;"></div>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="canvas"></canvas>
    </div>

</body>
</html>
